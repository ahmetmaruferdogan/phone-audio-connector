name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default. Only the release job gets write access.
permissions:
  contents: read

env:
  PROJECT: src/PhoneAudioConnector/PhoneAudioConnector.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      # On a tag like v1.2.3 the app gets version 1.2.3; otherwise the version in the .csproj is used.
      - name: Publish x64 and ARM64
        shell: pwsh
        run: |
          $versionArg = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $versionArg = @("-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))") }

          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish $env:PROJECT -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
              -p:DebugType=none @versionArg -o "publish/$rid"
            Compress-Archive -Path "publish/$rid/*" -DestinationPath "PhoneAudioConnector-$rid.zip" -Force
          }

          # Checksums so users can check their download is the real one.
          Get-FileHash PhoneAudioConnector-*.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAudioConnector
          path: |
            PhoneAudioConnector-*.zip
            SHA256SUMS.txt

  # Only runs when you push a tag like v1.0.0. Never runs for pull requests.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhoneAudioConnector

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PhoneAudioConnector-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
